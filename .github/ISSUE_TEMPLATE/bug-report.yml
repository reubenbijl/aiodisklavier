name: Bug report
description: The library did something wrong.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
      description: A few lines of code that show it are worth more than a description.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Of aiodisklavier, of Python, and the piano's firmware if you know it.
      placeholder: "aiodisklavier 0.3.0, Python 3.13, firmware 5.24.00"
    validations:
      required: true
  - type: textarea
    id: probe
    attributes:
      label: Output of `python -m aiodisklavier <ip>` (if the piano is involved)
      description: >-
        Read-only and silent. It prints no titles, ids or account details, and it is usually
        the fastest way to the cause — most surprises turn out to be the piano saying
        something this library has not heard before.
      render: markdown
  - type: textarea
    id: logs
    attributes:
      label: Traceback or log output
      description: A warning that a value was "not recognised" is especially useful.
      render: text
