name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[test,lint]"
      - name: ruff check
        run: ruff check .
      - name: ruff format
        run: ruff format --check .
      - name: mypy
        # Examples are the first thing users copy; keep them type-correct too.
        run: mypy aiodisklavier examples

  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Must match the Programming Language classifiers in pyproject.toml: claiming
        # support for a version CI never exercises is a promise the package cannot keep.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest]
        # The same rule, for "Operating System :: OS Independent". One macOS leg rather
        # than a full matrix: what differs between platforms here is sockets and paths,
        # not Python versions -- and it has differed. 0.2.0 shipped a positional-argument
        # slip in the SMB connect that macOS hid and Linux did not.
        include:
          - python-version: "3.13"
            os: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[test]"
      # Coverage is gated at 100% in pyproject.toml, so this fails on any gap.
      - run: pytest --cov --cov-report=term-missing

  floor:
    name: Test (lowest supported dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # The oldest Python the package supports: the oldest dependencies have no
          # wheels for the newest ones.
          python-version: "3.11"
      # The lower bounds in pyproject.toml are claims too. Every other job installs the
      # newest release of everything, so nothing else would notice one going stale -- and
      # two had. pytest-asyncio was floored a release below the config option the suite
      # depends on, and pysmb below the first release that imports without a warning, which
      # this job caught on its first run. `lowest-direct` pins this package's own
      # requirements to their floors and leaves their dependencies to resolve normally.
      # uv does not byte-compile on install, so every module is compiled on first import
      # here -- which is what surfaces a compile-time warning that pip's install would hide.
      - run: pip install uv
      - run: uv pip install --system --resolution lowest-direct -e ".[test]"
      - run: uv pip list --system
      - run: pytest --cov --cov-report=term-missing

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - name: Check metadata renders on PyPI
        run: twine check dist/*
      # py.typed is data, not code: nothing fails without it, consumers just silently
      # stop seeing the type hints. Assert it made it into the wheel.
      - name: Check the type marker is packaged
        run: python -c "import glob, zipfile; n = zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); assert 'aiodisklavier/py.typed' in n, n"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
