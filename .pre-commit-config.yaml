# Mirrors the CI lint job, so a push is never the first place a lint failure shows up.
#   pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        # mypy needs the runtime dependencies importable to see their types. Listing
        # them here rather than reusing the local venv keeps the hook working from a
        # git commit, where the venv is not necessarily active.
        additional_dependencies: [aiohttp, yarl]
        # Check the package as a unit; strict mode against a file at a time gives
        # different, noisier answers than CI does.
        pass_filenames: false
        args: [aiodisklavier, examples]
